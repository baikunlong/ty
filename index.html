<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘岗位列表</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: system-ui, sans-serif;}
        body{background-color:#f5f6f7;padding:20px;max-width:1000px;margin:0 auto;}
        h1{color:#333;margin-bottom:24px;font-size:22px;}
        .job-item{
            background:#fff;
            border-radius:10px;
            padding:18px;
            margin-bottom:14px;
            display:flex;
            justify-content:space-between;
            border:1px solid #eee;
        }
        .job-left{flex:1;}
        .job-title{font-size:18px;color:#222;font-weight:500;}
        .salary{color:#ff5544;font-weight:bold;margin-left:10px;}
        .job-meta{margin:10px 0;color:#666;font-size:14px;gap:10px;display:flex;flex-wrap:wrap;}
        .company-name{color:#444;font-size:15px;margin-top:6px;}
        .tag{
            background:#f4f5f7;color:#666;
            padding:3px 8px;border-radius:4px;font-size:12px;
        }
        .job-desc{margin-top:10px;font-size:13px;color:#777;line-height:1.5;}
        .job-right{color:#999;font-size:13px;white-space:nowrap;}
        .loading{text-align:center;padding:40px;color:#888;}
    </style>
</head>
<body>
    <h1>招聘岗位信息v1</h1>
    <div id="jobList" class="loading">数据加载中...</div>

    <script>
        const jobListEl = document.getElementById('jobList');
        // 读取json
        fetch('./data.json')
        .then(res=>res.json())
        .then(data=>{
            jobListEl.classList.remove('loading');
            jobListEl.innerHTML = '';
            data.forEach(job=>{
                const html = `
                <div class="job-item">
                    <div class="job-left">
                        <div>
                            <span class="job-title">${job.positionName}</span>
                            <span class="salary">${job.salary}</span>
                        </div>
                        <div class="job-meta">
                            <span>${job.city}</span>
                            <span class="tag">${job.experience}</span>
                            <span class="tag">${job.education}</span>
                        </div>
                        <div class="company-name">${job.companyName} | ${job.industry}</div>
                        <div class="job-desc">${job.desc}</div>
                    </div>
                    <div class="job-right">${job.publishTime}</div>
                </div>
                `
                jobListEl.innerHTML += html;
            })
        })
        .catch(err=>{
            jobListEl.innerText = '加载失败，请用本地服务打开！';
            console.error(err);
        })
    </script>
</body>
</html>
